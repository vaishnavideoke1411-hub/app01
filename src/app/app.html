<button class="btn btn-sm btn-info">Submit</button>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-12">

      <p class=" alert alert-danger mt-3">
        {{str()}}
      </p>

      <hr>
      <h3 class="alert alert-info">{{title()}}</h3>

      <button
        [disabled]="!isFormValid()"

        (click)="onClick()"
        class="btn btn btn-sm btn-outline-info ">
          Change Skill
    </button>
      

    <hr>

    @if (flag()) {
      <h3 class="alert alert-warning">
        Yes, we have Heading :: {{heading()}}
      </h3>
    }@else {
      <h3 class="alert alert-warning">
        No, We don't have Heading...!
      </h3>
    }

    <button 
      (click)="onclicks()"
      class="btn btn-sm btn-outline-warning">
        Change Heading
    </button>

<hr>

    <h4 class="alert alert-dark">Skill List</h4>
    <ul class="list-group">
      @for (skill of skills; track skill) {
        <li class="list-group-item  d-flex justify-content-between">
          I Love {{skill}}

          <button class="btn btn-outline-danger" (click)="removeS($index)">Remove Skill</button>
        </li>
      }@empty{
        <p class="alert alert-info">ARRAY is Emprty</p>
      }
    </ul>

    </div>
  </div>
</div>
